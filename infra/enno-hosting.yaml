AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Enno (budget PWA) static hosting: private S3 bucket served only through CloudFront (OAC),
  HTTPS-only with security headers. The app keeps all data in the browser / Google Drive;
  nothing user-specific is stored here. Deploy in the project Region (eu-north-1).

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  DomainName:
    Type: String
    Default: ''
    Description: Custom domain (e.g. ennakkoon.fi). www.<domain> redirects to it. Empty = CloudFront URL only.
  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate in us-east-1 covering DomainName and www.DomainName.

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, '']]

Resources:
  WwwRedirect:
    Type: AWS::CloudFront::Function
    Condition: HasDomain
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          One origin only. localStorage is per origin, so serving the app on both www and the apex
          would make a user's budget seem to vanish when they switch.
    Properties:
      Name: !Sub '${AWS::StackName}-www-redirect'
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect www to the apex domain
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var req = event.request;
          if (req.headers.host && req.headers.host.value === 'www.${DomainName}') {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: 'https://${DomainName}' + req.uri } }
            };
          }
          return req;
        }

  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Holds the app shell files (html/css/js/icons). Versioning allows rolling back a bad deploy.
        must: Stay private; only CloudFront (via OAC) may read it.
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: Browser security headers. CSP allows Google Identity Services (Drive sign-in) and the Drive API.
        must: >-
          Keep accounts.google.com/gsi and www.googleapis.com allowed or Drive sync breaks.
          style-src needs 'unsafe-inline' because app.js renders style attributes.
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'self';
              script-src 'self' https://accounts.google.com/gsi/client;
              style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style;
              connect-src 'self' https://www.googleapis.com https://accounts.google.com/gsi/;
              frame-src https://accounts.google.com/gsi/;
              img-src 'self' data:;
              object-src 'none'; base-uri 'self'; frame-ancestors 'none'

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Enno budget app
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases: !If
          - HasDomain
          - [!Ref DomainName, !Sub 'www.${DomainName}']
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: s3-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized. Honors the origin Cache-Control (s-maxage) set at upload time.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations: !If
            - HasDomain
            - - EventType: viewer-request
                FunctionARN: !GetAtt WwwRedirect.FunctionMetadata.FunctionARN
            - !Ref AWS::NoValue

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  SiteUrl:
    Value: !If [HasDomain, !Sub 'https://${DomainName}/', !Sub 'https://${Distribution.DomainName}/']
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
